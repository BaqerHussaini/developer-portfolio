<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
    <title id="title">Abstract LLM evaluation dashboard</title>
    <desc id="description">A dark dashboard with a bar chart, a rising quality line, and measurement markers.</desc>
    <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#17171d"/>
            <stop offset="1" stop-color="#3a2c2b"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0" stop-color="#d98961"/>
            <stop offset="1" stop-color="#f5d6c4"/>
        </linearGradient>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
        </pattern>
    </defs>
    <rect width="1200" height="675" fill="url(#background)"/>
    <rect width="1200" height="675" fill="url(#grid)"/>
    <circle cx="1010" cy="105" r="230" fill="#e9a17a" opacity=".08"/>
    <circle cx="170" cy="650" r="280" fill="#7d8cff" opacity=".06"/>
    <g transform="translate(170 145)">
        <rect width="860" height="385" rx="24" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".13"/>
        <rect x="40" y="42" width="250" height="12" rx="6" fill="#ffffff" opacity=".34"/>
        <rect x="40" y="70" width="150" height="8" rx="4" fill="#ffffff" opacity=".14"/>
        <g transform="translate(40 128)">
            <rect x="0" y="74" width="34" height="86" rx="8" fill="#ffffff" opacity=".12"/>
