            <path d="M0 44H330" stroke="#ffffff" stroke-opacity=".08" stroke-dasharray="4 8"/>
        </g>
        <g transform="translate(430 42)">
            <rect width="382" height="285" rx="18" fill="#0d0d12" fill-opacity=".42" stroke="#ffffff" stroke-opacity=".08"/>
            <path d="M34 224H348" stroke="#ffffff" stroke-opacity=".1"/>
            <path d="M34 160H348" stroke="#ffffff" stroke-opacity=".06" stroke-dasharray="4 8"/>
            <path d="M34 96H348" stroke="#ffffff" stroke-opacity=".06" stroke-dasharray="4 8"/>
            <path d="M34 222C78 210 94 178 126 184C164 191 176 138 214 142C254 146 270 92 305 76C323 68 335 61 348 52" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
            <circle cx="34" cy="222" r="6" fill="#f5d6c4"/>
            <circle cx="126" cy="184" r="6" fill="#f5d6c4"/>
            <circle cx="214" cy="142" r="6" fill="#f5d6c4"/>
