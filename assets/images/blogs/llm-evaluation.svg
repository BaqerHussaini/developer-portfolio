            <rect x="112" y="88" width="34" height="72" rx="8" fill="#ffffff" opacity=".12"/>
            <rect x="168" y="20" width="34" height="140" rx="8" fill="url(#accent)" opacity=".9"/>
            <rect x="224" y="60" width="34" height="100" rx="8" fill="#ffffff" opacity=".16"/>
            <rect x="280" y="36" width="34" height="124" rx="8" fill="#ffffff" opacity=".22"/>
            <path d="M0 160H330" stroke="#ffffff" stroke-opacity=".14"/>
